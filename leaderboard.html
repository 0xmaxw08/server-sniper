<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Sniper: Leaderboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(ellipse at top,#0e1a26,#070b10 60%);color:#cfe8ff;font-family:"JetBrains Mono",Consolas,monospace;min-height:100vh;padding:4vh 8vw}
  h1{text-align:center;font-size:clamp(28px,5vw,64px);color:#00ff88;text-shadow:0 0 20px #00ff88;letter-spacing:6px}
  h1 span{color:#38d6ff;text-shadow:0 0 20px #38d6ff}
  .sub{text-align:center;color:#5d7a92;letter-spacing:4px;margin:6px 0 4vh}
  table{width:100%;border-collapse:collapse;font-size:clamp(16px,2.6vw,34px)}
  tr{border-bottom:1px solid #1c2a38}
  td{padding:1.2vh 12px}
  td.rank{width:12%;color:#5d7a92}
  td.score{text-align:right;color:#ffd400;font-weight:800}
  td.tag{width:6%;text-align:center}
  tr:nth-child(1) td{color:#ffd400;text-shadow:0 0 14px #ffd400;font-size:1.25em}
  tr:nth-child(2) td.name,tr:nth-child(3) td.name{color:#fff}
  .empty{text-align:center;color:#5d7a92;margin-top:10vh;font-size:22px}
  #reset{position:fixed;right:16px;bottom:16px;opacity:.35;font:700 16px/1 inherit;font-family:inherit;letter-spacing:2px;color:#fff;background:#1a2733;border:1px solid #38566f;border-radius:8px;padding:14px 22px;cursor:pointer}
  #reset:hover{opacity:1;border-color:#ff2d55;color:#ff2d55}
  #resetPanel{position:fixed;right:16px;bottom:16px;width:340px;background:#0d141c;border:1px solid #ff2d55;border-radius:10px;padding:18px;box-shadow:0 0 30px rgba(255,45,85,.3);display:none;z-index:10}
  #resetPanel.open{display:block}
  #resetPanel p{font-size:14px;margin-bottom:10px;color:#cfe8ff}
  #resetPanel input{width:100%;padding:12px;margin-bottom:10px;background:#05080c;border:1px solid #1c2a38;border-radius:6px;color:#cfe8ff;font:inherit;font-size:16px}
  #resetPanel .row{display:flex;gap:10px}
  #resetPanel button{flex:1;padding:12px;font:inherit;font-weight:800;letter-spacing:1px;cursor:pointer;border-radius:6px;border:none}
  #doReset{background:#ff2d55;color:#fff}
  #cancelReset{background:#1a2733;color:#cfe8ff}
  #resetMsg{font-size:13px;margin-top:10px;min-height:1em;color:#ffd400}
</style>
</head>
<body>
<h1>SERVER<span>SNIPER</span></h1>
<div class="sub">TOP SRES // LIVE LEADERBOARD</div>
<div id="out"></div>
<button id="reset">RESET SCORES</button>
<div id="resetPanel">
  <p>Enter passcode to clear <b>ALL</b> scores:</p>
  <input id="resetPass" type="password" placeholder="passcode" autocomplete="off">
  <div class="row"><button id="doReset">CLEAR ALL</button><button id="cancelReset">CANCEL</button></div>
  <div id="resetMsg"></div>
</div>
<script src="config.js"></script>
<script>
  const KEY = "serverSniperScores";
  const DB = (window.SNIPER_DB_URL || "").replace(/\/+$/, "");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  async function render() {
    let list = [];
    if (DB) {
      try {
        const all = await (await fetch(`${DB}/scores.json`, { cache: "no-store" })).json() || {};
        list = Object.values(all).filter(s => s && typeof s.score === "number").sort((a, b) => b.score - a.score);
      } catch (e) { return; }   // keep showing the last good board if the network blips
    } else {
      try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
    }
    const out = document.getElementById("out");
    if (!list.length) { out.innerHTML = '<div class="empty">No runs yet. Be the first SRE.</div>'; return; }
    out.innerHTML = "<table>" + list.slice(0, 10).map((e, i) =>
      `<tr><td class="rank">#${i + 1}</td><td class="name">${esc(e.name)}</td>` +
      `<td class="tag">${e.survived ? "✅" : "💀"}</td><td class="score">${e.score.toLocaleString()}</td></tr>`).join("") + "</table>";
  }
  render();
  window.addEventListener("storage", e => { if (e.key === KEY) render(); });
  try { new BroadcastChannel("sniper").onmessage = render; } catch (e) {}
  setInterval(render, 3000); // fallback
  // Online mode: Firebase pushes a stream event on every change, so refresh instantly.
  if (DB) { try { const es = new EventSource(`${DB}/scores.json`); es.addEventListener("put", render); es.addEventListener("patch", render); } catch (e) {} }
  // Reset: asks for a passcode (change it here or set window.SNIPER_RESET_PASS in config.js).
  // NOTE: this is client-side only, so it stops accidental clicks, not a determined person.
  const RESET_PASS = window.SNIPER_RESET_PASS || "reset";
  const panel = document.getElementById("resetPanel"), passEl = document.getElementById("resetPass"), msg = document.getElementById("resetMsg");
  const openPanel = () => { panel.classList.add("open"); document.getElementById("reset").style.display = "none"; msg.textContent = ""; passEl.value = ""; passEl.focus(); };
  const closePanel = () => { panel.classList.remove("open"); document.getElementById("reset").style.display = ""; };
  document.getElementById("reset").onclick = openPanel;
  document.getElementById("cancelReset").onclick = closePanel;
  passEl.addEventListener("keydown", e => { if (e.key === "Enter") doReset(); if (e.key === "Escape") closePanel(); });
  document.getElementById("doReset").onclick = doReset;
  async function doReset() {
    if (passEl.value !== RESET_PASS) { msg.textContent = "Wrong passcode."; return; }
    msg.textContent = "Clearing...";
    localStorage.removeItem(KEY);
    if (DB) {
      try {
        const r = await fetch(`${DB}/scores.json`, { method: "DELETE" });
        if (!r.ok) throw new Error(r.status);
      } catch (e) { msg.textContent = "Could not clear online scores (" + e.message + "). Check Firebase rules."; return; }
    }
    await render();
    msg.textContent = "Cleared.";
    setTimeout(closePanel, 800);
  }
</script>
</body>
</html>
